// Isolated UI verification; does not replace the installed app or its session.
allprojects { project ->
    project.plugins.withId('com.android.application') {
        project.androidComponents.finalizeDsl { android ->
            android.buildTypes.getByName('debug').applicationIdSuffix = '.servicepreview'
            android.defaultConfig.testInstrumentationRunner = 'com.softlutionic.mobile.ServicesSmokeInstrumentation'
        }
    }
}
